<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — JAPORMS</title>
  <meta name="description" content="Log in to your JAPORMS account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>
  <div class="glow-sphere glow-3"></div>
  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon"></div>
      <span>JAPORMS</span>
    </a>
    <nav>
      <a href="index.html#features">Features</a>
      <a href="index.html#dashboard">Swipe Deck</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="index.html#faq">FAQ</a>
      <a href="liked.html">Liked</a>
      <a href="rejected.html">Rejected</a>
    </nav>
    <div class="header-actions" id="authSlot">
      <a href="login.html" class="btn-signin" style="text-decoration:none;">Sign In</a>
      <a href="signup.html" class="btn btn-primary" style="padding: 0.6rem 1.4rem; font-size: 0.85rem;">Get Started</a>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#features" class="mobile-link">Features</a>
    <a href="index.html#dashboard" class="mobile-link">Swipe Deck</a>
    <a href="index.html#pricing" class="mobile-link">Pricing</a>
    <a href="index.html#faq" class="mobile-link">FAQ</a>
    <a href="liked.html" class="mobile-link">Liked</a>
    <a href="rejected.html" class="mobile-link">Rejected</a>
    <div style="display: flex; flex-direction: column; gap: 1rem; width: 80%; margin-top: 1rem;">
      <a href="login.html" class="btn btn-secondary" style="width: 100%;">Sign In</a>
      <a href="signup.html" class="btn btn-primary" style="width: 100%;">Get Started</a>
    </div>
  </div>

  <section class="auth-wrap">
    <div class="auth-card" style="max-width: 460px;">
      <span class="badge" style="margin-bottom:1rem;">Welcome Back</span>
      <h2>Log In</h2>
      <p>Pick up right where your swipe deck left off.</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="you@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="Your password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Log In</button>

        <p style="text-align:center; font-size:0.85rem; margin-top:1.2rem;">
          <a href="#" id="forgotPassword" style="color:var(--secondary); font-weight:600;">Forgot password?</a>
        </p>
        <p style="text-align:center; font-size:0.85rem; margin-top:0.6rem;">
          No account yet? <a href="signup.html" style="color:var(--primary); font-weight:600;">Create one</a>
        </p>
      </form>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- Firebase (compat SDKs — simplest for plain JS, no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
